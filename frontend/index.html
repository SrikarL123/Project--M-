<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BountyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">BountyFlow</div>

        <button id="connectWallet" class="wallet-btn">
            Connect/Change Wallet
        </button>
    </header>

    <main>

        <section class="hero">
            <h1>Build. Submit. Get Paid.</h1>
            <p>
                A decentralized bounty platform powered by Monad.
            </p>

            <div id="walletStatus" class="wallet-status">
                Wallet not connected
            </div>

            <div class="testnet-notice">
                ⚠️ Monad Testnet demo — Testnet MON only. AI suggestions are editable.
            </div>
        </section>

        <section class="create-section">

            <h2>Create a Bounty</h2>

            <!-- AI Generation -->
            <div class="ai-section">
                <label for="aiPrompt">Describe your task in plain English:</label>
                <div class="ai-input-row">
                    <input
                        id="aiPrompt"
                        type="text"
                        placeholder="e.g. Design a landing page for a coffee shop"
                    >
                    <button type="button" id="aiGenerateBtn">
                        ✨ Generate with AI
                    </button>
                </div>
                <div id="aiStatus" class="ai-status"></div>
            </div>

            <hr class="divider">

            <form id="bountyForm">

                <input
                    id="title"
                    type="text"
                    placeholder="Bounty title"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Describe the work required"
                    required
                ></textarea>

                <input
                    id="reward"
                    type="number"
                    step="0.001"
                    min="0"
                    placeholder="Reward in MON"
                    required
                >

                <input
                    id="deadline"
                    type="datetime-local"
                    required
                >

                <button type="submit">
                    Create Bounty
                </button>

            </form>

            <div id="transactionStatus"></div>

        </section>

        <section class="bounties-section">

            <div class="section-header">
                <h2>Available Bounties</h2>

                <button id="refreshBounties">
                    Refresh
                </button>
            </div>

            <div id="bounties">
                <p>No bounties loaded.</p>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script><script type="module" src="app.js"></script>

</body>
</html>
